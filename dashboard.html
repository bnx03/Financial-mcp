<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valuation Desk</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e8e6df;min-height:100vh}
.topbar{background:#111;border-bottom:1px solid #222;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:12px;flex-wrap:wrap}
.logo{font-size:19px;font-weight:700;letter-spacing:-.5px}.logo span{color:#3b8fe8}
.search-row{display:flex;gap:8px}
.search-row input{background:#1a1a1a;border:1px solid #2e2e2e;color:#e8e6df;padding:9px 16px;border-radius:8px;font-size:14px;width:240px;outline:none;transition:border .2s}
.search-row input:focus{border-color:#3b8fe8}
.search-row button{background:#3b8fe8;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;transition:background .2s}
.search-row button:hover{background:#2a6fb5}
.main{max-width:980px;margin:0 auto;padding:32px 24px}
.section-title{font-size:11px;letter-spacing:.08em;color:#555;text-transform:uppercase;margin-bottom:12px;margin-top:32px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:#1e1e1e}
.card{background:#111;border:1px solid #1e1e1e;border-radius:14px;padding:20px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:600;color:#e8e6df;margin-bottom:4px}
.card-sub{font-size:12px;color:#555;margin-bottom:16px;line-height:1.5}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:4px}
.metric-card{background:#161616;border-radius:10px;padding:14px 16px;border:1px solid #1e1e1e}
.metric-label{font-size:11px;color:#666;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.metric-value{font-size:21px;font-weight:700;color:#e8e6df}
.metric-sub{font-size:11px;color:#444;margin-top:3px}
.verdict-bar{display:flex;align-items:center;gap:14px;border-radius:12px;padding:16px 20px;margin-bottom:4px;border:1px solid}
.verdict-icon{font-size:26px;flex-shrink:0}
.verdict-label{font-size:16px;font-weight:700}
.verdict-sub{font-size:12px;opacity:.7;margin-top:2px}
/* Fair Value Bar */
.fv-wrap{margin-top:8px}
.fv-zones{display:flex;height:36px;border-radius:8px;overflow:hidden;margin-bottom:10px;position:relative}
.fv-zone{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;letter-spacing:.04em}
.fv-zone-under{background:rgba(29,158,117,.25);color:#1D9E75;flex:2}
.fv-zone-fair{background:rgba(239,159,39,.2);color:#EF9F27;flex:1}
.fv-zone-over{background:rgba(226,75,74,.2);color:#E24B4A;flex:2}
.fv-marker{position:absolute;top:0;bottom:0;width:3px;background:#fff;border-radius:2px;transition:left .6s ease}
.fv-prices{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;flex-wrap:wrap;gap:8px}
.fv-price-box{text-align:center}
.fv-price-label{font-size:11px;color:#555;margin-bottom:3px}
.fv-price-val{font-size:22px;font-weight:700}
.fv-diff{font-size:13px;font-weight:600;padding:4px 12px;border-radius:20px;margin-top:6px;display:inline-block}
/* Charts */
.chart-wrap{position:relative;margin-top:8px}
.chart-h180{height:180px}
.chart-h220{height:220px}
.chart-tabs{display:flex;gap:6px;margin-bottom:14px}
.chart-tab{font-size:12px;padding:4px 12px;border-radius:12px;border:1px solid #2a2a2a;background:transparent;cursor:pointer;color:#666;transition:all .2s}
.chart-tab.active{background:rgba(59,143,232,.15);color:#3b8fe8;border-color:#3b8fe8}
/* Pillars */
.pillar{background:#111;border:1px solid #1e1e1e;border-radius:12px;padding:18px;margin-bottom:12px}
.pillar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pillar-name{font-size:14px;font-weight:600}
.badge{font-size:12px;font-weight:600;border-radius:20px;padding:3px 14px}
.badge-cheap{background:rgba(29,158,117,.15);color:#1D9E75}
.badge-fair{background:rgba(239,159,39,.15);color:#EF9F27}
.badge-exp{background:rgba(226,75,74,.15);color:#E24B4A}
.bar-track{height:6px;background:#1a1a1a;border-radius:3px;margin:10px 0 5px}
.bar-fill{height:6px;border-radius:3px;transition:width .8s ease}
.bar-labels{display:flex;justify-content:space-between;font-size:11px;color:#444}
.pillar-desc{font-size:12px;color:#666;margin-top:10px;line-height:1.6}
.yield-row{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.yield-card{flex:1;min-width:100px;background:#161616;border-radius:8px;padding:12px;border:1px solid #1e1e1e}
.yield-label{font-size:11px;color:#555;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.yield-val{font-size:22px;font-weight:700}
.range-track{position:relative;height:8px;background:#1a1a1a;border-radius:4px;margin:10px 0 8px}
.range-fill{height:8px;background:#3b8fe8;border-radius:4px}
.range-cursor{position:absolute;top:-5px;width:3px;height:18px;background:#e8e6df;border-radius:2px}
.range-ends{display:flex;justify-content:space-between;font-size:11px;color:#555}
/* AI */
.ai-ring{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid;flex-shrink:0}
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.ai-card{background:#161616;border-radius:8px;padding:10px 14px;border:1px solid #1e1e1e}
.ai-card-label{font-size:11px;color:#555;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.ai-card-val{font-size:15px;font-weight:700}
.ai-card-desc{font-size:11px;color:#555;margin-top:3px;line-height:1.4}
.ai-quote{font-size:12px;color:#777;font-style:italic;border-left:2px solid #3b8fe8;padding-left:12px;margin:14px 0;line-height:1.6}
.signal-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #181818}
.signal-row:last-child{border-bottom:none}
.signal-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.signal-type{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.04em}
.signal-text{font-size:13px;color:#bbb;margin-top:3px;line-height:1.4}
.prod-chip{font-size:11px;padding:3px 10px;border-radius:12px;background:rgba(83,74,183,.2);color:#AFA9EC;margin:2px;display:inline-block}
.risk-box{background:rgba(226,75,74,.07);border:1px solid rgba(226,75,74,.2);border-radius:8px;padding:12px 14px;margin-top:12px}
.risk-title{font-size:11px;font-weight:700;color:#E24B4A;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.risk-item{font-size:12px;color:#E24B4A;display:flex;gap:6px;padding:3px 0;line-height:1.4}
/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{font-size:13px;padding:6px 16px;border-radius:20px;border:1px solid #222;background:transparent;cursor:pointer;color:#666;transition:all .2s}
.tab.active{background:rgba(59,143,232,.12);color:#3b8fe8;border-color:#3b8fe8}
.stmt-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.stmt-table th{text-align:left;padding:8px 10px;color:#555;font-weight:500;border-bottom:1px solid #1e1e1e}
.stmt-table th:not(:first-child){text-align:right}
.stmt-table td{padding:8px 10px;border-bottom:1px solid #161616;color:#777;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stmt-table td:not(:first-child){text-align:right}
.stmt-table tr:hover td{background:#161616}
.row-bold{font-weight:600;color:#e8e6df!important}
.pos{color:#1D9E75!important}.neg{color:#E24B4A!important}
/* Progress */
.progress-box{background:#111;border:1px solid #1e1e1e;border-radius:14px;padding:24px;margin-bottom:16px}
.prog-title{font-size:16px;font-weight:700;margin-bottom:4px}
.prog-sub{font-size:12px;color:#555;margin-bottom:14px}
.prog-track{height:4px;background:#1a1a1a;border-radius:2px;margin-bottom:14px;overflow:hidden}
.prog-fill{height:4px;background:#3b8fe8;border-radius:2px;transition:width .5s ease}
.prog-step{font-size:12px;display:flex;align-items:center;gap:8px;padding:5px 0;color:#555}
.prog-step.active{color:#3b8fe8}.prog-step.done{color:#1D9E75}
.spinner{width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:rgba(226,75,74,.07);border:1px solid rgba(226,75,74,.25);border-radius:12px;padding:16px 20px;color:#E24B4A;font-size:13px;line-height:1.6}
.cached-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.cache-chip{font-size:11px;padding:3px 10px;border-radius:10px;background:#161616;color:#666;border:1px solid #222;cursor:pointer;transition:all .2s}
.cache-chip:hover{color:#e8e6df;border-color:#444}
.cached-badge{font-size:11px;padding:3px 10px;border-radius:10px;background:rgba(29,158,117,.15);color:#1D9E75;display:inline-flex;align-items:center;gap:5px}
.refresh-btn{font-size:11px;background:transparent;border:1px solid #222;color:#555;padding:3px 10px;border-radius:10px;cursor:pointer;transition:all .2s}
.refresh-btn:hover{color:#e8e6df;border-color:#444}
.company-header{margin-bottom:24px}
.ticker-pill{font-size:13px;padding:3px 12px;border-radius:20px;background:rgba(59,143,232,.15);color:#3b8fe8;font-weight:600;display:inline-block;margin-bottom:8px}
.company-name{font-size:28px;font-weight:800;line-height:1.1;margin-bottom:4px}
.sector-label{font-size:13px;color:#555}
.empty{text-align:center;padding:80px 20px;color:#444}
.empty-title{font-size:20px;font-weight:700;margin-bottom:8px;color:#666}
.empty-sub{font-size:14px;line-height:1.7;max-width:420px;margin:0 auto}
footer{text-align:center;padding:28px;font-size:11px;color:#333;border-top:1px solid #161616;margin-top:48px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.two-col{grid-template-columns:1fr}.ai-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">Valuation <span>Desk</span></div>
  <div class="search-row">
    <input type="text" id="tickerInput" placeholder="AAPL, BKNG, NVDA, GOOGL..." />
    <button onclick="analyze()">Analyze</button>
  </div>
</div>

<div class="main">
  <div id="cachedBar"></div>
  <div id="result">
    <div class="empty">
      <div class="empty-title">Enter a ticker to begin</div>
      <div class="empty-sub">Full valuation analysis — DCF fair value, earnings history, PE ratio trends, Bravos Research framework, and AI adoption signals from financial filings.</div>
    </div>
  </div>
</div>

<footer>Valuation Desk · FRED · Polygon.io · S&amp;P Global · For informational purposes only · Not financial advice</footer>

<script>
const API = '/chat';
const CACHE_TTL = 60 * 60 * 1000;
const mem = {};

document.getElementById('tickerInput').addEventListener('keydown', e => { if(e.key==='Enter') analyze(); });

function getCached(t){const e=mem[t];if(e&&(Date.now()-e.ts)<CACHE_TTL)return e.data;try{const s=localStorage.getItem('vd2_'+t);if(s){const p=JSON.parse(s);if((Date.now()-p.ts)<CACHE_TTL){mem[t]=p;return p.data;}}}catch(e){}return null;}
function setCached(t,data){const e={data,ts:Date.now()};mem[t]=e;try{localStorage.setItem('vd2_'+t,JSON.stringify(e));}catch(e){}renderCacheBar();}
function clearTicker(t){delete mem[t];try{localStorage.removeItem('vd2_'+t);}catch(e){}renderCacheBar();}
function renderCacheBar(){const tickers=Object.keys(mem).filter(t=>(Date.now()-mem[t].ts)<CACHE_TTL);const bar=document.getElementById('cachedBar');if(!tickers.length){bar.innerHTML='';return;}bar.innerHTML=`<div class="cached-bar"><span style="font-size:11px;color:#444">Cached:</span>${tickers.map(t=>`<span class="cache-chip" onclick="loadCached('${t}')">${t}</span>`).join('')}<span style="font-size:11px;color:#333;cursor:pointer;text-decoration:underline;margin-left:4px" onclick="clearAll()">clear all</span></div>`;}
function loadCached(t){document.getElementById('tickerInput').value=t;const c=getCached(t);if(c)render(c.fin,c.ai,true);else analyze(t);}
function clearAll(){Object.keys(mem).forEach(t=>{delete mem[t];try{localStorage.removeItem('vd2_'+t);}catch(e){}});renderCacheBar();}

function fmt(n,d=2){if(n===null||n===undefined||isNaN(n))return'—';return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fmtB(n){if(!n)return'—';return n>=1e9?'$'+(n/1e9).toFixed(1)+'B':'$'+(n/1e6).toFixed(0)+'M';}
function fmtPct(n){return(n!==null&&n!==undefined&&!isNaN(n))?fmt(n)+'%':'—';}

function setProgress(step,pct){
  const b=document.getElementById('prog-fill');if(b)b.style.width=pct+'%';
  ['ps1','ps2','ps3'].forEach((id,i)=>{const el=document.getElementById(id);if(!el)return;el.className='prog-step '+(i<step?'done':i===step?'active':'');const ic=el.querySelector('.pico');if(!ic)return;ic.innerHTML=i<step?'✓':i===step?'<div class="spinner"></div>':'○';});
}
function showProgress(ticker){
  document.getElementById('result').innerHTML=`<div class="progress-box"><div class="prog-title">Analyzing ${ticker}...</div><div class="prog-sub">Fetching financials, DCF data, AI signals · ~10–15 sec</div><div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:5%"></div></div><div id="ps1" class="prog-step active"><span class="pico"><div class="spinner"></div></span> Fetching financials & valuation data</div><div id="ps2" class="prog-step"><span class="pico">○</span> Analyzing AI signals from filings</div><div id="ps3" class="prog-step"><span class="pico">○</span> Rendering dashboard</div></div>`;
  setProgress(0,5);
}

async function callServer(system,prompt){
  const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system,messages:[{role:'user',content:prompt}]})});
  const data=await res.json();
  if(!res.ok)throw new Error(`Server ${res.status}: ${data.error||JSON.stringify(data).slice(0,200)}`);
  if(data.error)throw new Error(data.error);
  const text=data.content?.filter(b=>b.type==='text').map(b=>b.text).join('');
  if(!text)throw new Error('Empty response: '+JSON.stringify(data).slice(0,200));
  try{return JSON.parse(text.replace(/```json|```/g,'').trim());}
  catch(e){throw new Error('JSON parse failed. Raw: '+text.slice(0,300));}
}

async function analyze(forceTicker){
  const ticker=(forceTicker||document.getElementById('tickerInput').value||'').trim().toUpperCase();
  if(!ticker)return;
  document.getElementById('tickerInput').value=ticker;
  const cached=getCached(ticker);
  if(cached){render(cached.fin,cached.ai,true);return;}
  showProgress(ticker);
  try{
    const finP=callServer(
      'You are a financial analyst. Return ONLY valid JSON, no markdown, no explanation.',
      `For stock ${ticker} return ONLY this JSON with real data:
{
  "companyName":string,
  "ticker":string,
  "sector":string,
  "exchange":string,
  "currentPrice":number,
  "marketCap":number,
  "peRatio":number,
  "forwardPE":number,
  "sectorAvgPE":number,
  "shillerPE":37.5,
  "earningsYield":number,
  "cashYield":4.3,
  "revenueGrowthYoY":number,
  "netMargin":number,
  "grossMargin":number,
  "roe":number,
  "debtToEquity":number,
  "dividendYield":number,
  "fiftyTwoWeekHigh":number,
  "fiftyTwoWeekLow":number,
  "priceVsHigh":number,
  "dcfFairValue":number,
  "dcfUpDownside":number,
  "analystTargetPrice":number,
  "peHistoryAnnual":[{"year":number,"pe":number}],
  "annualRevenue":[{"year":number,"revenue":number,"netIncome":number,"grossProfit":number,"operatingIncome":number}],
  "balanceSheet":{"totalAssets":number,"totalDebt":number,"cashAndEquivalents":number,"shareholdersEquity":number},
  "priceHistory":[{"year":number,"price":number,"dcfValue":number}]
}
For dcfFairValue use a DCF estimate based on FCF. For peHistoryAnnual provide last 5 years PE. For priceHistory provide last 5 years average annual price vs estimated DCF fair value each year. Use shillerPE=37.5 and cashYield=4.3.`
    );
    setProgress(0,38);
    const aiP=callServer(
      'You are an AI adoption analyst. Return ONLY valid JSON, no markdown.',
      `Analyze AI adoption for ${ticker} from its recent annual reports and earnings calls. Return ONLY JSON:
{"adoptionScore":number,"adoptionLabel":"Leader"|"Adopter"|"Early stage"|"No signal","aiRevenue":number|null,"aiRevenueGrowth":number|null,"aiCapex":number|null,"aiMarginImpact":"positive"|"neutral"|"negative"|"mixed","aiMarginDetail":string,"signals":[{"type":"revenue"|"cost"|"strategy"|"product"|"risk","sentiment":"positive"|"neutral"|"negative","text":string}],"keyQuote":string,"aiProducts":[string],"riskFlags":[string]}`
    );
    setProgress(1,68);
    const[fin,ai]=await Promise.all([finP,aiP]);
    setProgress(2,93);
    setCached(ticker,{fin,ai});
    window._fin=fin;window._ai=ai;
    setTimeout(()=>render(fin,ai,false),80);
  }catch(e){
    document.getElementById('result').innerHTML=`<div class="error-box">Could not load data for ${ticker}.<br><small style="opacity:.6">${e.message}</small></div>`;
  }
}

function scoreLabel(s){return s>=66?['Cheap','cheap']:s>=33?['Fair value','fair']:['Expensive','exp'];}
function badgeClass(c){return'badge badge-'+c;}
function barColor(c){return c==='cheap'?'#1D9E75':c==='fair'?'#EF9F27':'#E24B4A';}

function render(d,ai,fromCache){
  // Scoring
  const pePct=Math.min(100,Math.max(0,100-((d.peRatio-10)/(Math.max(d.sectorAvgPE,25)*1.5-10))*100));
  const spreadGood=d.earningsYield>d.cashYield;
  const spreadScore=spreadGood?Math.min(100,50+(d.earningsYield-d.cashYield)*10):Math.max(0,50-(d.cashYield-d.earningsYield)*10);
  const techScore=d.priceVsHigh<-20?75:d.priceVsHigh<-10?55:d.priceVsHigh<-5?40:25;
  const overall=Math.round((pePct+spreadScore+techScore)/3);
  const[ov,ovc]=scoreLabel(overall);
  const[,p1c]=scoreLabel(pePct);
  const[,p2c]=scoreLabel(spreadScore);
  const[,p3c]=scoreLabel(techScore);

  const vColors={cheap:{bg:'rgba(29,158,117,.08)',border:'rgba(29,158,117,.25)',icon:'↑',col:'#1D9E75'},fair:{bg:'rgba(239,159,39,.08)',border:'rgba(239,159,39,.25)',icon:'→',col:'#EF9F27'},exp:{bg:'rgba(226,75,74,.08)',border:'rgba(226,75,74,.25)',icon:'↓',col:'#E24B4A'}};
  const vc=vColors[ovc];

  // DCF
  const dcfPct=d.dcfFairValue>0?((d.dcfFairValue-d.currentPrice)/d.dcfFairValue)*100:0;
  const isUnder=dcfPct>0;
  const dcfColor=dcfPct>20?'#1D9E75':dcfPct>0?'#EF9F27':'#E24B4A';
  const markerPos=d.dcfFairValue>0?Math.max(5,Math.min(95,(d.currentPrice/d.dcfFairValue)*100*0.6)):50;

  // AI
  const aiScore=ai?.adoptionScore??0;
  const aiColor=aiScore>=70?'#1D9E75':aiScore>=40?'#EF9F27':'#555';
  const aiBorder=aiScore>=70?'#1D9E75':aiScore>=40?'#EF9F27':'#333';
  const aiBadge=aiScore>=70?'badge-cheap':aiScore>=40?'badge-fair':'badge-exp';
  const mc={positive:'#1D9E75',negative:'#E24B4A',neutral:'#888',mixed:'#EF9F27'}[ai?.aiMarginImpact]||'#888';
  const dc=s=>s==='positive'?'#1D9E75':s==='negative'?'#E24B4A':'#555';

  const signals=(ai?.signals||[]).map(s=>`<div class="signal-row"><div class="signal-dot" style="background:${dc(s.sentiment)}"></div><div style="flex:1;min-width:0"><div class="signal-type">${s.type} · ${s.sentiment}</div><div class="signal-text">${s.text}</div></div></div>`).join('');
  const prods=(ai?.aiProducts||[]).map(p=>`<span class="prod-chip">${p}</span>`).join('');
  const risks=(ai?.riskFlags||[]).map(r=>`<div class="risk-item">▲ ${r}</div>`).join('');

  const rng=(()=>{const r=d.fiftyTwoWeekHigh-d.fiftyTwoWeekLow;const p=r>0?Math.max(2,Math.min(97,((d.currentPrice-d.fiftyTwoWeekLow)/r)*100)):50;return`<div class="range-fill" style="width:${p}%"></div><div class="range-cursor" style="left:${p}%"></div>`;})();

  document.getElementById('result').innerHTML=`
    ${fromCache?`<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px"><span class="cached-badge">⚡ Cached</span><button class="refresh-btn" onclick="refreshTicker('${d.ticker}')">Refresh data</button></div>`:''}

    <div class="company-header">
      <div class="ticker-pill">${d.ticker} · ${d.exchange||d.sector||''}</div>
      <div class="company-name">${d.companyName}</div>
      <div class="sector-label">${d.sector||''}</div>
    </div>

    <div class="verdict-bar" style="background:${vc.bg};border-color:${vc.border}">
      <div class="verdict-icon" style="color:${vc.col}">${vc.icon}</div>
      <div>
        <div class="verdict-label" style="color:${vc.col}">${ov} — composite score ${overall}/100</div>
        <div class="verdict-sub" style="color:${vc.col}">Bravos valuation · yield spread · technical positioning</div>
      </div>
    </div>

    <div class="section-title">Key metrics</div>
    <div class="metrics-grid">
      <div class="metric-card"><div class="metric-label">Price</div><div class="metric-value">$${fmt(d.currentPrice)}</div><div class="metric-sub">${fmtB(d.marketCap)} mkt cap</div></div>
      <div class="metric-card"><div class="metric-label">PE ratio</div><div class="metric-value">${fmt(d.peRatio,1)}x</div><div class="metric-sub">Fwd ${fmt(d.forwardPE,1)}x</div></div>
      <div class="metric-card"><div class="metric-label">DCF Fair Value</div><div class="metric-value" style="color:${dcfColor}">$${fmt(d.dcfFairValue)}</div><div class="metric-sub">${isUnder?'+':''}${fmt(dcfPct,1)}% ${isUnder?'upside':'downside'}</div></div>
      <div class="metric-card"><div class="metric-label">Net margin</div><div class="metric-value">${fmtPct(d.netMargin)}</div><div class="metric-sub">Gross ${fmtPct(d.grossMargin)}</div></div>
      <div class="metric-card"><div class="metric-label">Rev growth</div><div class="metric-value">${fmtPct(d.revenueGrowthYoY)}</div><div class="metric-sub">YoY</div></div>
      <div class="metric-card"><div class="metric-label">ROE</div><div class="metric-value">${fmtPct(d.roe)}</div><div class="metric-sub">D/E ${fmt(d.debtToEquity,2)}</div></div>
    </div>

    <div class="section-title">1.1 Share price vs fair value</div>
    <div class="card">
      <div class="card-title">What is the fair price of ${d.ticker} looking at future cash flows?</div>
      <div class="card-sub">Based on a Discounted Cash Flow (DCF) model using free cash flow projections.</div>
      <div class="fv-wrap">
        <div class="fv-zones">
          <div class="fv-zone fv-zone-under">20% Undervalued</div>
          <div class="fv-zone fv-zone-fair">About Right</div>
          <div class="fv-zone fv-zone-over">20% Overvalued</div>
          <div class="fv-marker" style="left:${markerPos}%"></div>
        </div>
        <div class="fv-prices">
          <div class="fv-price-box">
            <div class="fv-price-label">Current price</div>
            <div class="fv-price-val">$${fmt(d.currentPrice)}</div>
          </div>
          <div style="text-align:center">
            <div class="fv-diff" style="background:${isUnder?'rgba(29,158,117,.15)':'rgba(226,75,74,.15)'};color:${dcfColor}">${isUnder?'▲':'▼'} ${Math.abs(dcfPct).toFixed(1)}% ${isUnder?'Undervalued':'Overvalued'}</div>
          </div>
          <div class="fv-price-box" style="text-align:right">
            <div class="fv-price-label">DCF fair value</div>
            <div class="fv-price-val" style="color:${dcfColor}">$${fmt(d.dcfFairValue)}</div>
          </div>
        </div>
        ${d.analystTargetPrice?`<div style="margin-top:10px;font-size:12px;color:#555">Analyst consensus target: <strong style="color:#e8e6df">$${fmt(d.analystTargetPrice)}</strong></div>`:''}
      </div>
    </div>

    <div class="section-title">1.2 Future cash flow value history</div>
    <div class="card">
      <div class="card-title">Price vs DCF fair value over time</div>
      <div class="card-sub">Green = share price · Pink = estimated DCF intrinsic value each year</div>
      <div class="chart-wrap chart-h180"><canvas id="priceHistChart"></canvas></div>
    </div>

    <div class="section-title">3.2 Earnings & revenue history</div>
    <div class="card">
      <div class="card-title">Annual revenue and net income</div>
      <div class="card-sub">Trailing twelve months · Bars represent annual figures in billions USD</div>
      <div class="chart-wrap chart-h220"><canvas id="earnChart"></canvas></div>
    </div>

    <div class="section-title">3.3 Historical price to earnings ratio</div>
    <div class="card">
      <div class="card-title">PE ratio over the last 5 years</div>
      <div class="card-sub">Higher ratios indicate investors are willing to pay more per dollar of earnings. Sector average shown for reference.</div>
      <div class="chart-wrap chart-h180"><canvas id="peChart"></canvas></div>
    </div>

    <div class="section-title">Bravos research framework</div>

    <div class="pillar">
      <div class="pillar-header"><span class="pillar-name">Pillar 1 — Valuation (PE analysis)</span><span class="${badgeClass(p1c)}">${scoreLabel(pePct)[0]}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pePct}%;background:${barColor(p1c)}"></div></div>
      <div class="bar-labels"><span>Cheap</span><span>Expensive</span></div>
      <div class="pillar-desc">PE of <strong>${fmt(d.peRatio,1)}x</strong> vs sector avg <strong>${fmt(d.sectorAvgPE,1)}x</strong> and Shiller CAPE <strong>${fmt(d.shillerPE,1)}x</strong>. ${d.peRatio<d.sectorAvgPE?'Trading below sector average — a positive valuation signal.':'Trading above sector average — requires strong growth justification.'}</div>
    </div>

    <div class="pillar">
      <div class="pillar-header"><span class="pillar-name">Pillar 2 — Earnings yield vs cash yield</span><span class="${badgeClass(p2c)}">${scoreLabel(spreadScore)[0]}</span></div>
      <div class="yield-row">
        <div class="yield-card"><div class="yield-label">Earnings yield</div><div class="yield-val" style="color:${spreadGood?'#1D9E75':'#E24B4A'}">${fmtPct(d.earningsYield)}</div></div>
        <div style="display:flex;align-items:center;font-size:22px;color:#333">${spreadGood?'>':'<'}</div>
        <div class="yield-card"><div class="yield-label">Cash yield (risk-free)</div><div class="yield-val">${fmtPct(d.cashYield)}</div></div>
      </div>
      <div class="pillar-desc">${spreadGood?`Earnings yield ${fmtPct(d.earningsYield)} beats cash yield ${fmtPct(d.cashYield)} by ${fmt(d.earningsYield-d.cashYield,2)}pp — equities offer a meaningful premium over risk-free cash.`:`Cash yield ${fmtPct(d.cashYield)} exceeds earnings yield — holding T-bills pays more. Bravos flags this as a major peak warning signal seen only at major market tops.`}</div>
    </div>

    <div class="pillar">
      <div class="pillar-header"><span class="pillar-name">Pillar 3 — Technical positioning</span><span class="${badgeClass(p3c)}">${scoreLabel(techScore)[0]}</span></div>
      <div style="margin-top:8px">
        <div style="font-size:11px;color:#555;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em">52-week range</div>
        <div class="range-track">${rng}</div>
        <div class="range-ends"><span>Low $${fmt(d.fiftyTwoWeekLow)}</span><span style="color:#e8e6df;font-weight:600">Now $${fmt(d.currentPrice)}</span><span>High $${fmt(d.fiftyTwoWeekHigh)}</span></div>
      </div>
      <div class="pillar-desc">Price is <strong>${Math.abs(d.priceVsHigh).toFixed(1)}% ${d.priceVsHigh<0?'below':'above'} its 52-week high</strong>. ${d.priceVsHigh<-20?'Deep pullback — Bravos looks for macro confirmation before entering.':d.priceVsHigh<-10?'Moderate pullback — potentially attractive entry zone.':'Near highs — momentum favors bulls but limits margin of safety.'} Dividend yield: ${d.dividendYield>0?fmtPct(d.dividendYield):'none'}.</div>
    </div>

    <div class="section-title">AI adoption analysis</div>
    <div class="card" style="border-color:${aiBorder}">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <div class="ai-ring" style="border-color:${aiBorder}"><span style="font-size:18px;font-weight:800;color:${aiColor}">${aiScore}</span></div>
        <div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:15px;font-weight:700">AI adoption</span><span class="${badgeClass(aiBadge)}">${ai?.adoptionLabel||'—'}</span></div>
          <div style="font-size:12px;color:#555;margin-top:3px">Score out of 100 · based on financial statements, filings and earnings calls</div>
        </div>
      </div>
      <div class="ai-grid">
        <div class="ai-card"><div class="ai-card-label">AI revenue</div><div class="ai-card-val" style="color:${ai?.aiRevenue?'#1D9E75':'#555'}">${ai?.aiRevenue?'$'+ai.aiRevenue.toFixed(1)+'B':'Not disclosed'}</div><div class="ai-card-desc">${ai?.aiRevenueGrowth?'Growing '+ai.aiRevenueGrowth.toFixed(0)+'% YoY':'Not separately reported'}</div></div>
        <div class="ai-card"><div class="ai-card-label">AI capex</div><div class="ai-card-val" style="color:#3b8fe8">${ai?.aiCapex?'$'+ai.aiCapex.toFixed(1)+'B':'—'}</div><div class="ai-card-desc">Investment in AI infrastructure</div></div>
        <div class="ai-card"><div class="ai-card-label">Margin impact</div><div class="ai-card-val" style="color:${mc};text-transform:capitalize">${ai?.aiMarginImpact||'—'}</div><div class="ai-card-desc">${ai?.aiMarginDetail||'No data in filings'}</div></div>
        <div class="ai-card"><div class="ai-card-label">AI products</div><div class="ai-card-val">${(ai?.aiProducts||[]).length||0}</div><div class="ai-card-desc">${(ai?.aiProducts||[]).length?'Active offerings identified':'No distinct AI products found'}</div></div>
      </div>
      ${ai?.keyQuote?`<div class="ai-quote">"${ai.keyQuote}"<span style="font-size:11px;color:#444;margin-left:8px">— recent filing</span></div>`:''}
      ${signals?`<div style="margin-top:12px"><div style="font-size:11px;font-weight:600;color:#555;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em">Signals from filings</div>${signals}</div>`:''}
      ${prods?`<div style="margin-top:14px"><div style="font-size:11px;font-weight:600;color:#555;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em">AI products and services</div>${prods}</div>`:''}
      ${risks?`<div class="risk-box"><div class="risk-title">AI risk flags from filings</div>${risks}</div>`:''}
    </div>

    <div class="section-title">Financial statements</div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('income',this)">Income statement</button>
      <button class="tab" onclick="switchTab('balance',this)">Balance sheet</button>
    </div>
    <div id="stmtContent"></div>
  `;

  switchTab('income', document.querySelector('.tab.active'));
  setTimeout(()=>{
    drawPriceHistChart(d);
    drawEarnChart(d);
    drawPEChart(d);
  }, 120);
}

function refreshTicker(t){clearTicker(t);analyze(t);}

function drawPriceHistChart(d){
  const ctx=document.getElementById('priceHistChart');if(!ctx)return;
  if(window._phc)window._phc.destroy();
  const rows=(d.priceHistory||[]).sort((a,b)=>a.year-b.year);
  if(!rows.length)return;
  window._phc=new Chart(ctx,{
    type:'line',
    data:{
      labels:rows.map(r=>r.year),
      datasets:[
        {label:'Share price',data:rows.map(r=>r.price),borderColor:'#1D9E75',backgroundColor:'rgba(29,158,117,.08)',borderWidth:2,pointRadius:3,pointBackgroundColor:'#1D9E75',fill:true,tension:.3},
        {label:'DCF fair value',data:rows.map(r=>r.dcfValue),borderColor:'#e87bc0',backgroundColor:'rgba(232,123,192,.05)',borderWidth:2,pointRadius:3,pointBackgroundColor:'#e87bc0',fill:false,tension:.3,borderDash:[4,3]}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#666',font:{size:11},boxWidth:12}}},scales:{x:{ticks:{color:'#555',font:{size:11}},grid:{color:'#161616'}},y:{ticks:{color:'#555',font:{size:11},callback:v=>'$'+v},grid:{color:'#161616'}}}}
  });
}

function drawEarnChart(d){
  const ctx=document.getElementById('earnChart');if(!ctx)return;
  if(window._ec)window._ec.destroy();
  const rows=(d.annualRevenue||[]).sort((a,b)=>a.year-b.year);
  if(!rows.length)return;
  window._ec=new Chart(ctx,{
    type:'bar',
    data:{
      labels:rows.map(r=>r.year),
      datasets:[
        {label:'Revenue',data:rows.map(r=>r.revenue),backgroundColor:'rgba(59,143,232,.7)',borderRadius:4},
        {label:'Net income',data:rows.map(r=>r.netIncome),backgroundColor:'rgba(29,158,117,.7)',borderRadius:4}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#666',font:{size:11},boxWidth:12}}},scales:{x:{ticks:{color:'#555',font:{size:11}},grid:{display:false}},y:{ticks:{color:'#555',font:{size:11},callback:v=>'$'+v+'B'},grid:{color:'#161616'}}}}
  });
}

function drawPEChart(d){
  const ctx=document.getElementById('peChart');if(!ctx)return;
  if(window._pec)window._pec.destroy();
  const rows=(d.peHistoryAnnual||[]).sort((a,b)=>a.year-b.year);
  if(!rows.length)return;
  const avgPE=rows.reduce((s,r)=>s+r.pe,0)/rows.length;
  window._pec=new Chart(ctx,{
    type:'line',
    data:{
      labels:rows.map(r=>r.year),
      datasets:[
        {label:'PE ratio',data:rows.map(r=>r.pe),borderColor:'#3b8fe8',backgroundColor:'rgba(59,143,232,.08)',borderWidth:2,pointRadius:4,pointBackgroundColor:'#3b8fe8',fill:true,tension:.3},
        {label:'5yr average',data:rows.map(()=>parseFloat(avgPE.toFixed(1))),borderColor:'#EF9F27',borderWidth:1.5,borderDash:[5,4],pointRadius:0,fill:false}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#666',font:{size:11},boxWidth:12}}},scales:{x:{ticks:{color:'#555',font:{size:11}},grid:{color:'#161616'}},y:{ticks:{color:'#555',font:{size:11},callback:v=>v+'x'},grid:{color:'#161616'}}}}
  });
}

function switchTab(tab,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  const d=window._fin,el=document.getElementById('stmtContent');
  if(!el||!d)return;
  if(tab==='income'){
    const rows=(d.annualRevenue||[]).slice().reverse();
    el.innerHTML=`<table class="stmt-table"><thead><tr><th style="width:38%">Metric</th>${rows.map(r=>`<th>${r.year}</th>`).join('')}</tr></thead><tbody>
      <tr><td class="row-bold">Revenue</td>${rows.map(r=>`<td>$${r.revenue?.toFixed(1)}B</td>`).join('')}</tr>
      <tr><td class="row-bold">Gross profit</td>${rows.map(r=>`<td>${r.grossProfit?'$'+r.grossProfit.toFixed(1)+'B':'—'}</td>`).join('')}</tr>
      <tr><td class="row-bold">Operating income</td>${rows.map(r=>`<td>${r.operatingIncome?'$'+r.operatingIncome.toFixed(1)+'B':'—'}</td>`).join('')}</tr>
      <tr><td class="row-bold">Net income</td>${rows.map(r=>`<td class="${r.netIncome>0?'pos':'neg'}">$${r.netIncome?.toFixed(1)}B</td>`).join('')}</tr>
    </tbody></table>`;
  }else{
    const bs=d.balanceSheet||{};
    const net=(bs.cashAndEquivalents||0)-(bs.totalDebt||0);
    el.innerHTML=`<table class="stmt-table"><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody>
      <tr><td class="row-bold">Total assets</td><td>${bs.totalAssets?'$'+bs.totalAssets.toFixed(1)+'B':'—'}</td></tr>
      <tr><td class="row-bold">Total debt</td><td class="neg">${bs.totalDebt?'$'+bs.totalDebt.toFixed(1)+'B':'—'}</td></tr>
      <tr><td class="row-bold">Cash & equivalents</td><td class="pos">${bs.cashAndEquivalents?'$'+bs.cashAndEquivalents.toFixed(1)+'B':'—'}</td></tr>
      <tr><td class="row-bold">Shareholders equity</td><td>${bs.shareholdersEquity?'$'+bs.shareholdersEquity.toFixed(1)+'B':'—'}</td></tr>
      <tr><td class="row-bold">Net cash position</td><td class="${net>0?'pos':'neg'}">$${net.toFixed(1)}B</td></tr>
    </tbody></table>`;
  }
}

renderCacheBar();
</script>
</body>
</html>
